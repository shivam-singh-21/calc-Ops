<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Operations Calculator | calc-ops</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Roboto", sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background-color: #0b1517;
      }

      /* Navbar */
      nav {
        background: linear-gradient(90deg, #c03a12, #030949);
        margin: 0 15px;
        margin-top: 5px;
        border-radius: 5px;
        padding: 15px 20px;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      nav .logo {
        font-size: 1.5rem;
        font-weight: bold;
      }
      nav ul {
        list-style: none;
        display: flex;
        gap: 20px;
      }
      nav ul li a {
        color: white;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s;
      }
      nav ul li a:hover {
        color: #f1c40f;
      }

      /* Calculator Box */
      .container {
        background: #ecf0f1;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 420px;
        margin: 50px auto;
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #2c3e50;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        color: #2c3e50;
      }
      select,
      input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
        margin-bottom: 15px;
      }
      button {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        font-weight: 600;
        background-color: #051a60;
            color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background: #2980b9;
      }
      .result {
        margin-top: 20px;
        background: #f3f8ff;
        border-left: 4px solid #3498db;
        padding: 10px;
        border-radius: 8px;
        display: none;
      }
      .result strong {
        color: #3498db;
      }

      /* Footer */
      footer {
        margin-top: auto;
        margin-left: 15px;
        margin-right: 15px;
        border-radius: 10px;
        background: linear-gradient(90deg, #c03a12, #030949);
        color: white;
        text-align: center;
        padding: 20px 10px;
      }

      @media (max-width: 600px) {
        .container {
          padding: 15px;
          width: 95%;
        }
        select,
        input,
        button {
          font-size: 14px;
          padding: 8px;
        }
        nav ul {
          gap: 10px;
        }
      }
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">CalcOps</div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#operations">Calculator</a></li>
      </ul>
    </nav>

    <div class="container" id="calc">
      <h2>Math Operations Calculator</h2>

      <label for="mathOperation">Select Operation:</label>
      <select id="mathOperation" onchange="updateInputs()">
        <option value="sqrt">Square Root</option>
        <option value="power">Power / Exponent</option>
        <option value="factorial">Factorial</option>
        <option value="percentage">Percentage</option>
        <option value="modulus">Modulus</option>
      </select>

      <div id="inputContainer">
        <label for="input1">Enter Number:</label>
        <input type="number" id="input1" placeholder="Enter value" />
        <div id="extraInput"></div>
      </div>

      <button onclick="calculateMath()">Calculate</button>
      <div id="mathResult" class="result"></div>
    </div>

    <footer>
      &copy; 2025 CalcOps. All Rights Reserved.<br />Designed with ❤️ for
      Learners
    </footer>

    <script>
      function updateInputs() {
        const op = document.getElementById("mathOperation").value;
        const extraInput = document.getElementById("extraInput");
        extraInput.innerHTML = "";
        if (op === "power") {
          extraInput.innerHTML =
            '<label for="input2">Enter Exponent:</label><input type="number" id="input2" placeholder="Exponent"/>';
        } else if (op === "percentage") {
          extraInput.innerHTML =
            '<label for="input2">Of Number:</label><input type="number" id="input2" placeholder="Total"/>';
        } else if (op === "modulus") {
          extraInput.innerHTML =
            '<label for="input2">Modulus With:</label><input type="number" id="input2" placeholder="Modulus"/>';
        }
      }

      function calculateMath() {
        const op = document.getElementById("mathOperation").value;
        const num1 = parseFloat(document.getElementById("input1").value);
        const mathResult = document.getElementById("mathResult");
        let num2 = 0;
        if (["power", "percentage", "modulus"].includes(op)) {
          num2 = parseFloat(document.getElementById("input2").value);
        }

        if (
          isNaN(num1) ||
          (["power", "percentage", "modulus"].includes(op) && isNaN(num2))
        ) {
          mathResult.style.display = "block";
          mathResult.innerHTML =
            "<strong>Error:</strong> Please enter valid number(s).";
          return;
        }

        let result;
        switch (op) {
          case "sqrt":
            result = Math.sqrt(num1);
            break;
          case "power":
            result = Math.pow(num1, num2);
            break;
          case "factorial":
            if (num1 < 0) {
              mathResult.style.display = "block";
              mathResult.innerHTML =
                "Factorial not defined for negative numbers.";
              return;
            }
            result = 1;
            for (let i = 1; i <= num1; i++) result *= i;
            break;
          case "percentage":
            result = (num1 / 100) * num2;
            break;
          case "modulus":
            result = num1 % num2;
            break;
        }

        mathResult.style.display = "block";
        mathResult.innerHTML = `<strong>Result:</strong> ${result}`;
      }

      updateInputs();
    </script>
  </body>
</html>
